{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 4rem auto;" class="card">
    <h2>System Authentication</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <div style="margin-bottom: 1rem;">
            <label>Username</label>
            <input type="text" name="username" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
        </div>
        <div style="margin-bottom: 1rem;">
            <label>Password</label>
            <input type="password" name="password" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
    </form>
    <div style="margin-top: 1rem; display: flex; justify-content: space-between;">
        <a href="{{ url_for('register') }}" style="color: var(--accent-blue);">Register Account</a>
        <a href="{{ url_for('reset_request') }}" style="color: var(--btn-danger-fg);">Reset Password</a>
    </div>
</div>
{% endblock %}
