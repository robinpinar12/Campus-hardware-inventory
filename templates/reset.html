{% extends "base.html" %}

{% block title %}Reset Password - Campus Inventory{% endblock %}

{% block content %}
<h2>Request Password Reset</h2>
<form method="POST" action="{{ url_for('reset_request') }}">
    <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required>
    </div>
    <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
    </div>
    <div class="form-group">
        <label>New Password</label>
        <input type="password" name="new_password" required>
    </div>
    <!-- Replace existing submit button -->
<button class="primary wide" type="submit" style="background-color: #d67a00; border-color: #d67a00; color: white;">Send Verification Code <span>→</span></button>
</form>

<div class="links">
    <a href="{{ url_for('login') }}">Back to Login</a>
</div>
{% endblock %}
